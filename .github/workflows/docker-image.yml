name: Build & Push (自动+手动发布)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_latest:
        description: '是否同时更新 latest 标签？'
        required: true
        type: boolean
        default: true

env:
  # 请替换为你的 Docker Hub 用户名/仓库名
  IMAGE_NAME: unsplash/bili-qq-bot

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version from latest commit subject
        id: version
        shell: bash
        run: |
          commit_subject="$(git log -1 --pretty=%s)"
          echo "Detected commit subject: ${commit_subject}"
          if [[ "${commit_subject}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]].*)?$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Latest commit subject must start with vX.Y.Z, current: ${commit_subject}"
            exit 1
          fi

      - name: Resolve latest tag strategy
        id: latest
        shell: bash
        run: |
          push_latest=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            push_latest="${{ inputs.push_latest }}"
          fi
          echo "push_latest=${push_latest}" >> "$GITHUB_OUTPUT"

      # 生成 Tag 逻辑
      # 版本由最新 commit subject 的 vX.Y.Z 提取为 X.Y.Z
      # 自动触发默认推 latest；手动触发由 push_latest 控制
      - name: Generate Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.push_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 这里指定使用我们刚才创建的专用 Dockerfile
          file: ./Dockerfile.action
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
