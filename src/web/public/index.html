<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bili QQ Bot 管理后台</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1 class="header-title">Bili QQ Bot 管理后台</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" id="globalConfigBtn">全局配置</button>
        <button class="btn btn-secondary" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" class="search-input" id="groupSearch" placeholder="搜索群组...">
      </div>
      <div class="group-list" id="groupList">
        <!-- Group cards will be inserted here -->
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <div class="empty-state" id="emptyState">
        <p>请选择一个群组</p>
      </div>
      <div class="group-panel hidden" id="groupPanel">
        <!-- Group details will be inserted here -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Global Config Modal -->
  <div class="modal-overlay hidden" id="globalConfigModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>全局配置</h2>
        <button class="btn-icon" id="closeModalBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="config-item">
          <label>订阅轮询间隔 (秒)</label>
          <input type="number" id="globalSubscriptionInterval" class="config-input"
                 placeholder="默认: 60" min="10" max="3600">
          <p class="config-hint">检查订阅更新的时间间隔（10-3600秒）</p>
        </div>

        <div class="config-section">
          <h4>默认深色模式设置</h4>
          <div class="config-item">
            <select id="globalNightMode" class="config-select">
              <option value="off">关闭</option>
              <option value="on">开启</option>
              <option value="timed">定时</option>
            </select>
          </div>
          <div class="config-item hidden" id="globalNightModeTimeContainer">
            <label>定时时间</label>
            <input type="text" id="globalNightModeTime" class="config-input"
                   placeholder="22:00-07:00">
            <p class="config-hint">格式：开始时间-结束时间，例如 22:00-07:00</p>
          </div>
        </div>

        <div class="config-section">
          <h4>默认标签显示配置</h4>
          <div class="config-grid">
            <label><input type="checkbox" id="globalLabelVideo"> 视频</label>
            <label><input type="checkbox" id="globalLabelLive"> 直播</label>
            <label><input type="checkbox" id="globalLabelDynamic"> 动态</label>
            <label><input type="checkbox" id="globalLabelArticle"> 专栏</label>
            <label><input type="checkbox" id="globalLabelBangumi"> 番剧</label>
            <label><input type="checkbox" id="globalLabelUser"> 用户</label>
          </div>
        </div>

        <div class="config-section">
          <h4>默认 AI 配置</h4>
          <div class="config-item">
            <label>AI 上下文消息数</label>
            <input type="number" id="globalAiContext" class="config-input"
                   placeholder="默认: 10" min="1" max="50">
          </div>
          <div class="config-item">
            <label>AI 随机回复概率</label>
            <input type="number" id="globalAiProbability" class="config-input"
                   placeholder="默认: 0.1" min="0" max="1" step="0.1">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelModalBtn">取消</button>
        <button class="btn btn-primary" id="saveGlobalConfigBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- Bilibili Login Modal -->
  <div class="modal-overlay hidden" id="bilibiliLoginModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Bilibili 账号登录</h2>
        <button class="btn-icon" id="closeBilibiliLoginBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="login-status" id="loginStatus">
          <p class="info-text">使用 Bilibili 手机 APP 扫描二维码登录</p>
          <button class="btn btn-primary" id="getQrcodeBtn">获取登录二维码</button>
        </div>
        <div class="qrcode-container hidden" id="qrcodeContainer">
          <div class="qrcode-wrapper">
            <img id="qrcodeImage" src="" alt="登录二维码">
          </div>
          <p class="qrcode-hint">请使用 Bilibili APP 扫描二维码</p>
          <div class="login-progress" id="loginProgress">
            <div class="spinner"></div>
            <p>等待扫码...</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelBilibiliLoginBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- Following Sync Modal -->
  <div class="modal-overlay hidden" id="followingSyncModal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>从关注同步 - <span id="syncModalGroupName"></span></h2>
        <button class="btn-icon" id="closeFollowingSyncModalBtn">×</button>
      </div>

      <div class="modal-body">
        <!-- 两个 Tab 切换 -->
        <div class="sync-tabs">
          <button class="tab-btn active" data-sync-tab="groups">
            按分组同步
          </button>
          <button class="tab-btn" data-sync-tab="users">
            按用户选择
          </button>
        </div>

        <!-- Tab 1: 分组列表 -->
        <div class="sync-tab-content" id="syncGroupsTab">
          <p class="hint-text">
            勾选分组后，系统将自动同步这些分组的关注用户订阅
          </p>

          <div class="groups-list" id="followingGroupsList">
            <!-- 动态生成 -->
            <!--
            <label class="group-item">
              <input type="checkbox" value="特别关注" />
              <span class="group-name">特别关注</span>
              <span class="group-count">(15人)</span>
            </label>
            -->
          </div>

          <div class="current-sync-groups">
            <strong>当前已配置：</strong>
            <span id="currentSyncGroupsText">无</span>
          </div>
        </div>

        <!-- Tab 2: 用户列表 -->
        <div class="sync-tab-content hidden" id="syncUsersTab">
          <!-- 缓存信息和控制栏 -->
          <div class="cache-controls">
            <div class="cache-info">
              <span>上次刷新: </span>
              <span id="cacheLastRefreshTime">从未</span>
            </div>
            <button class="btn btn-secondary btn-sm" id="refreshFollowingsListBtn">
              刷新列表
            </button>
          </div>

          <!-- 用户选择控制 -->
          <div class="user-controls">
            <button class="btn btn-secondary btn-sm" id="selectAllUsersBtn">全选</button>
            <button class="btn btn-secondary btn-sm" id="unselectAllUsersBtn">取消全选</button>
            <span class="selected-count">已选: <strong id="selectedUserCount">0</strong></span>
          </div>

          <!-- 用户卡片网格 -->
          <div class="followings-grid" id="followingsUserGrid">
            <!-- 动态生成 -->
            <!--
            <label class="following-card">
              <input type="checkbox" class="following-checkbox" data-uid="123456" />
              <img class="following-avatar" src="..." />
              <div class="following-info">
                <div class="following-name">UP主名称</div>
                <div class="following-uid">UID: 123456</div>
              </div>
            </label>
            -->
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSyncModalBtn">取消</button>

        <!-- Tab 1 显示 -->
        <button class="btn btn-primary" id="saveSyncGroupsBtn">
          保存配置
        </button>

        <!-- Tab 2 显示 -->
        <button class="btn btn-primary hidden" id="batchSubscribeUsersBtn">
          批量订阅
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.1/qrcode.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
