services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
  bili-qq-bot:
    image: unsplash/bili-qq-bot:legacy
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./napcat/qq:/app/.config/QQ
    ports:
      - "3000:3000"
